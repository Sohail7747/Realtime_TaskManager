<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}TaskFlow{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/app.css" rel="stylesheet"></head>
<body class="user-body">
<aside class="sidebar user-sidebar">
  <a class="sidebar-brand" href="{% url 'home' %}"><span class="brand-mark small-mark">TF</span><span>TaskFlow<small>WORKSPACE</small></span></a>
  <div class="sidebar-label">WORKSPACE</div>
  <a class="side-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">▦ <span>Task board</span></a>
  <a class="side-link {% if request.resolver_match.url_name == 'activity' %}active{% endif %}" href="{% url 'activity' %}">◷ <span>Activity history</span></a>
  <div class="sidebar-bottom">
    {% if request.user.is_staff %}<a class="side-link" href="{% url 'admin_dashboard' %}">⚙ <span>Admin panel</span></a>{% endif %}
    <a class="side-link" href="{% url 'logout' %}">⇥ <span>Logout</span></a>
  </div>
</aside>
<div class="user-main">
  <header class="user-topbar"><span class="muted small">SIGNED IN AS <strong>{{ request.user.username }}</strong></span></header>
  <main class="user-content"><div class="container-fluid py-4">{% block content %}{% endblock %}</div></main>
</div>
{% block scripts %}{% endblock %}</body></html>
