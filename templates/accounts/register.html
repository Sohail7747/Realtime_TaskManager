{% extends "accounts/auth_base.html" %}
{% block title %}Create account · TaskFlow{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="brand-mark">TF</div>
  <h1>Create account</h1><p class="muted">Join the shared task workspace.</p>
  {% for message in messages %}<div class="alert alert-danger py-2">{{ message }}</div>{% endfor %}
  <form method="post">{% csrf_token %}
    <label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
    <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
    <label class="form-label">Confirm password</label><input class="form-control mb-3" type="password" name="password2" minlength="8" required>
    <button class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="text-center mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Sign in</a></p>
</div>
{% endblock %}
