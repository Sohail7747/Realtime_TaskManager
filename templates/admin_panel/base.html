<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Admin · TaskFlow{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/app.css" rel="stylesheet"></head><body class="admin-body">
<aside class="sidebar"><a class="sidebar-brand" href="{% url 'admin_dashboard' %}"><span class="brand-mark small-mark">TF</span><span>TaskFlow <small>ADMIN</small></span></a><div class="sidebar-label">WORKSPACE</div>
<a class="side-link {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}">▦ <span>Overview</span></a>
<a class="side-link {% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}" href="{% url 'admin_users' %}">♙ <span>Manage users</span></a>
<a class="side-link {% if request.resolver_match.url_name == 'admin_tasks' %}active{% endif %}" href="{% url 'admin_tasks' %}">☷ <span>Manage tasks</span></a>
<div class="sidebar-bottom"><a class="side-link" href="/">↗ <span>User workspace</span></a><a class="side-link" href="{% url 'logout' %}">⇥ <span>Logout</span></a></div></aside>
<div class="admin-main"><header class="admin-topbar"><div><span class="muted small">ADMINISTRATION</span><strong class="d-block">{% block heading %}Overview{% endblock %}</strong></div><span class="admin-avatar">{{ request.user.username|first|upper }}</span></header>
<main class="admin-content">{% block admin_content %}{% endblock %}</main></div>
{% block scripts %}{% endblock %}</body></html>
